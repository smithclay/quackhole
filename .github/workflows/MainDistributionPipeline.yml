#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  # Prose-only changes skip the five-platform matrix, which otherwise spends
  # ~5 minutes per arch rebuilding DuckDB to prove a README still parses.
  # web/ and test/ are deliberately absent: both are code the matrix covers.
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: quackhole
      # The Rust core (iroh + tokio) is built by cargo from CMake.
      extra_toolchains: 'rust'
      # iroh needs UDP sockets and a real tokio reactor, so every wasm target is
      # out. mingw/musl are excluded because the Rust staticlib does not link
      # cleanly against them.
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl'

  # The distribution pipeline builds the extension and runs its sqllogictests,
  # but it knows nothing about cargo -- so until this job existed, none of the
  # Rust tests ran in CI, including the HTTP framing that both clients share.
  # Network-gated tests stay gated: CI should not depend on n0's relays.
  rust-checks:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: quackhole
      format_checks: 'format;tidy'
