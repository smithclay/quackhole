# Publishes the extension binaries the demo downloads.
#
# `npx quackhole` fetches
#   releases/download/v<version>/quackhole-<platform>.duckdb_extension
# so the asset names below are load-bearing: renaming one breaks the first step
# of the onboarding on https://smithclay.github.io/quackhole/. The tag is the
# npm package's own version, not `latest` -- npm and releases are two publishing
# surfaces, and `latest` would let them disagree. See npm/README.md.
#
# The build is repeated here rather than reusing MainDistributionPipeline's
# artifacts, because artifacts do not cross workflow runs without a fragile
# fetch-from-another-run dance. Tags are rare; a duplicated matrix on a tag is
# the cheaper trade.
#
# duckdb_version and exclude_archs must stay identical to
# .github/workflows/MainDistributionPipeline.yml and description.yml, so that
# what CI proves is what gets published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (leave empty to build without publishing)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: quackhole
      extra_toolchains: 'rust'
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl'

  publish:
    name: Publish binaries
    needs: build
    # A dispatch with no tag is a way to exercise the matrix without cutting a
    # release, so publishing is opt-in rather than the default.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Lets the gh CLI work without a checkout.
      GH_REPO: ${{ github.repository }}
      DUCKDB_VERSION: v1.5.5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: quackhole-${{ env.DUCKDB_VERSION }}-extension-*
          path: artifacts

      - name: Name each binary after its platform
        run: |
          set -euo pipefail
          mkdir -p dist
          prefix="artifacts/quackhole-${DUCKDB_VERSION}-extension-"
          for dir in "$prefix"*/; do
            arch="${dir#"$prefix"}"
            arch="${arch%/}"
            cp "$dir/quackhole.duckdb_extension" "dist/quackhole-$arch.duckdb_extension"
          done
          ls -l dist

      - name: Upload to the release
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/* --clobber

  # After the binaries, never alongside them. `npx quackhole` downloads the
  # extension from this tag's release assets, so a package published before they
  # exist is a package that fails on first run for as long as the matrix takes.
  #
  # Needs an NPM_TOKEN secret with publish rights on `quackhole`. Without one
  # this job fails and the binaries are still published, which is the right way
  # round: the release is usable by every path except npx.
  npm:
    name: Publish to npm
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For npm provenance, which is worth having on a package whose whole point
      # is that strangers run it with npx.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The package ships web/wasm/, which is gitignored and built here -- the
      # same three steps pages.yml takes, for the same reason.
      - name: Install a wasm-capable C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build the iroh transport
        run: web/build-wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Both checks run before the assemble step, not after, because assembling
      # *writes* npm/package.json. Reading the version afterwards would only
      # prove the runner had just repaired it -- the committed drift would
      # publish fine and stay in the repo, and the next contributor running
      # `npx ../npm` would get a CLI pointed at the previous release.
      - name: Check the version is derived, and is this tag
        run: |
          set -euo pipefail
          node npm/build.mjs --check
          version="$(node -p "require('./npm/package.json').version")"
          [ "v$version" = "${GITHUB_REF_NAME}" ] || {
            echo "npm/package.json is $version but the tag is ${GITHUB_REF_NAME}." >&2
            echo "The version comes from crates/Cargo.toml -- see docs/UPDATING.md." >&2
            exit 1
          }

      - name: Assemble the package
        run: node npm/build.mjs

      - name: Publish
        working-directory: npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
