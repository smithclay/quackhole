[package]
name = "quackhole-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "iroh transport core for the quackhole DuckDB extension"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1"
# The ticket format. base64url so the whole thing survives a URL fragment
# untouched, and serde_json so reading one back is not a hand-rolled parser --
# the token field is attacker-shaped, being whatever a caller passed to `token :=`.
base64 = "0.22"
# The response codec. Default features are the pure-Rust miniz_oxide backend --
# no C toolchain, and it builds for wasm32-unknown-unknown, which matters
# because the browser client decodes with the same code the native one does.
flate2 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native: default features give metrics, portmapper and the Apple fast datapath.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
iroh = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Browser: no tokio, and iroh's defaults do not build for wasm. tls-ring has to
# be named explicitly -- n0's docs say default-features = false is enough, but
# presets::N0 is gated behind #[cfg(with_crypto_provider)], so dropping it
# compiles the preset away and the build fails on a missing `N0`.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }

[lints]
workspace = true
