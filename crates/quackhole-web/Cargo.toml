[package]
name = "quackhole-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Browser build of the quackhole iroh transport, for DuckDB-Wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quackhole-core = { path = "../quackhole-core" }
# Must match the core's wasm dependency exactly, including tls-ring: without it
# presets::N0 is compiled out (see the note in quackhole-core/Cargo.toml).
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }
# iroh's own async shim: mirrors the tokio API but backed by browser timers,
# so the timeout below works on a thread with no reactor.
n0-future = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"

[lints]
workspace = true
